# ============================================================
# nRF54L15 - HFXO always on / CPU never idle / RTT logging
# ============================================================

# ---------- 1. No power management, no system idle ----------
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_RUNTIME=n
# Idle is additionally prevented at run time by the lowest-priority
# "spinner" thread in main.c, so the idle thread is never scheduled
# and WFI is never executed.

# ---------- 2. Output: SEGGER RTT only, no UART ----------
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
# Deferred (NOT immediate): immediate mode logs synchronously from any
# context and is a known source of faults on nRF54L.
CONFIG_LOG_MODE_DEFERRED=y
# Block until the host drains the up-buffer, but give up after a few
# retries so a detached debugger cannot stall the log thread forever.
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_RTT_RETRY_CNT=4
CONFIG_LOG_BACKEND_RTT_RETRY_DELAY_MS=5
# The log thread must out-prioritise the spinner thread (which sits at
# K_LOWEST_APPLICATION_THREAD_PRIO), otherwise it would never run.
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=5
CONFIG_LOG_BUFFER_SIZE=4096

# ---------- 3. Proof that the CPU never idles ----------
# Gives k_thread_runtime_stats_all_get() the .idle_cycles counter.
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

# ---------- misc ----------
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=n
